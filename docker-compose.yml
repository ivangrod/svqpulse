services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    container_name: svqpulse-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: svqpulse
      POSTGRES_PASSWORD: svqpulse
      POSTGRES_DB: svqpulse
    volumes:
      - svqpulse-pg:/var/lib/postgresql
      - ./databases:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: svqpulse-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@svqpulse.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    volumes:
      - svqpulse-pgadmin:/var/lib/pgadmin

volumes:
  svqpulse-pg:
  svqpulse-pgadmin:
