services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    container_name: svqpulse-pg
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: svqpulse
      POSTGRES_PASSWORD: svqpulse
      POSTGRES_DB: svqpulse
    volumes:
      - svqpulse-pg:/var/lib/postgresql
      - ./databases:/docker-entrypoint-initdb.d

volumes:
  svqpulse-pg:
